name: PHASEBREAK feature
description: Scoped game development ticket
title: ""
body:
  - type: dropdown
    id: area
    attributes:
      label: Development area
      description: The matching area label is applied automatically after creation.
      options:
        - "area: interface"
        - "area: combat"
        - "area: world"
        - "area: progression"
        - "area: developer tools"
        - "area: quality"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the player or development outcome.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the work in this ticket and existing system owners to extend.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State observable completion checks.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Refer to other tickets by GitHub #number.
    validations:
      required: false
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: State work explicitly outside this ticket.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List focused Unity checks and relevant resolutions or scenes.
    validations:
      required: false
